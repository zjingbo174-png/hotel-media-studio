<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>酒店自媒体创作工作台</title>
    <script>
      // GitHub Pages 上是纯静态托管：任何 404 直接回到应用入口（应用使用 Hash 路由）。
      var base = location.pathname.replace(/\/[^/]*$/, '/');
      location.replace(base + 'index.html' + location.hash);
    </script>
  </head>
  <body></body>
</html>
